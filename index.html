<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Executive AMD Market Timing Overlay + Real-Time & Audio</title>
    <style>
        :root {
            --card-bg: rgba(10, 12, 15, 0.94);
            --border-color: rgba(212, 175, 55, 0.35);
            --gold-accent: #d4af37;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --status-open: #2ea44f;
            --status-closed: #da3633;
            --news-high: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 5px;
            -webkit-app-region: drag; /* Mengizinkan jendela digeser dengan mouse */
        }

        #market-widget-embedded {
            width: 500px;
            height: 200px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .card {
            background: rgba(18, 22, 28, 0.6);
            border: 1.5px solid var(--border-color);
            border-radius: 50%;
            width: 135px;
            height: 135px;
            padding: 6px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card.active-market {
            border-color: rgba(212, 175, 55, 0.85);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }

        .card-bg-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.38;
            z-index: 0;
        }

        .card-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .zone-title {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--gold-accent);
            margin-top: 1px;
        }

        .status-badge {
            font-size: 0.42rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 8px;
            text-transform: uppercase;
            margin-top: 1px;
        }

        .status-open {
            background-color: rgba(46, 164, 79, 0.25);
            color: #3fb950;
            border: 1px solid var(--status-open);
        }

        .status-closed {
            background-color: rgba(218, 54, 51, 0.25);
            color: #f85149;
            border: 1px solid var(--status-closed);
        }

        .time-display {
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            margin: 1px 0;
            color: #ffffff;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        .date-display {
            font-size: 0.52rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .market-info {
            width: 82%;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .market-info-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.48rem;
            color: var(--text-muted);
            margin-bottom: 1px;
        }

        .price-rate {
            color: #ffffff;
            font-weight: bold;
            font-family: monospace;
        }

        .progress-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 2px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #b8860b, var(--gold-accent));
            width: 0%;
            transition: width 0.5s ease;
        }

        /* BAR BERITA EKONOMI & ALARM CONTROLLER */
        #news-bar {
            width: 100%;
            background: rgba(18, 22, 28, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            padding: 3px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.52rem;
            color: var(--text-main);
            -webkit-app-region: no-drag;
        }

        .news-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .news-badge {
            background-color: var(--news-high);
            color: #fff;
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 0.48rem;
            font-weight: bold;
        }

        .audio-toggle {
            cursor: pointer;
            opacity: 0.8;
            font-size: 0.65rem;
            transition: opacity 0.2s;
        }

        .audio-toggle:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="market-widget-embedded">
        <!-- MARQUEE / BAR BERITA EKONOMI & CONTROL ALARM -->
        <div id="news-bar">
            <div class="news-item">
                <span class="news-badge">HIGH IMPACT</span>
                <span id="news-title">USD - FOMC Rate Decision</span>
                <span id="news-timer" style="color: var(--gold-accent); font-weight: bold;">(in 2h 15m)</span>
            </div>
            <div id="audio-btn" class="audio-toggle" title="Toggle Sound Chime">🔔</div>
        </div>

        <div class="container">
            <!-- TOKYO (USD/JPY) -->
            <div class="card" id="card-tokyo">
                <svg class="card-bg-art" id="chart-tokyo" viewBox="0 0 200 200" preserveAspectRatio="none"></svg>
                <div class="card-content">
                    <div class="zone-title">TOKYO (USD/JPY)</div>
                    <div id="status-tokyo" class="status-badge status-closed">Closed</div>
                    <div id="time-tokyo" class="time-display">00:00:00</div>
                    <div id="date-tokyo" class="date-display">-</div>
                    <div class="market-info">
                        <div class="market-info-row">
                            <span>Rate:</span>
                            <span id="rate-tokyo" class="price-rate">154.20</span>
                        </div>
                        <div class="market-info-row">
                            <span>Pattern:</span>
                            <span>Accumulation</span>
                        </div>
                        <div class="progress-bar-bg"><div id="progress-tokyo" class="progress-bar-fill"></div></div>
                    </div>
                </div>
            </div>

            <!-- LONDON (GBP/USD) -->
            <div class="card" id="card-london">
                <svg class="card-bg-art" id="chart-london" viewBox="0 0 200 200" preserveAspectRatio="none"></svg>
                <div class="card-content">
                    <div class="zone-title">LONDON (GBP/USD)</div>
                    <div id="status-london" class="status-badge status-closed">Closed</div>
                    <div id="time-london" class="time-display">00:00:00</div>
                    <div id="date-london" class="date-display">-</div>
                    <div class="market-info">
                        <div class="market-info-row">
                            <span>Rate:</span>
                            <span id="rate-london" class="price-rate">1.2650</span>
                        </div>
                        <div class="market-info-row">
                            <span>Pattern:</span>
                            <span>Manipulation</span>
                        </div>
                        <div class="progress-bar-bg"><div id="progress-london" class="progress-bar-fill"></div></div>
                    </div>
                </div>
            </div>

            <!-- NEW YORK (EUR/USD) -->
            <div class="card" id="card-newyork">
                <svg class="card-bg-art" id="chart-newyork" viewBox="0 0 200 200" preserveAspectRatio="none"></svg>
                <div class="card-content">
                    <div class="zone-title">NEW YORK (EUR/USD)</div>
                    <div id="status-newyork" class="status-badge status-closed">Closed</div>
                    <div id="time-newyork" class="time-display">00:00:00</div>
                    <div id="date-newyork" class="date-display">-</div>
                    <div class="market-info">
                        <div class="market-info-row">
                            <span>Rate:</span>
                            <span id="rate-newyork" class="price-rate">1.0840</span>
                        </div>
                        <div class="market-info-row">
                            <span>Pattern:</span>
                            <span>Distribution</span>
                        </div>
                        <div class="progress-bar-bg"><div id="progress-newyork" class="progress-bar-fill"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. AUDIO ALARM CHIME ENGINE (Web Audio API Synthesizer) ---
        let soundEnabled = true;
        const audioBtn = document.getElementById('audio-btn');

        audioBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            audioBtn.innerText = soundEnabled ? '🔔' : '🔕';
        });

        function playOpenChime() {
            if (!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Note D5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // Note A5

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (e) {
                console.log("Audio play blocked", e);
            }
        }


        // --- 2. MARKET DATA CONFIGURATION ---
        const markets = {
            tokyo: { type: 'ACCUMULATION', pair: 'USDJPY', timeZone: 'Asia/Tokyo', open: 9, close: 15, elemCard: document.getElementById('card-tokyo'), elemChart: document.getElementById('chart-tokyo'), elemTime: document.getElementById('time-tokyo'), elemDate: document.getElementById('date-tokyo'), elemStatus: document.getElementById('status-tokyo'), elemRate: document.getElementById('rate-tokyo'), elemProgress: document.getElementById('progress-tokyo'), candles: [], wasOpen: false },
            london: { type: 'MANIPULATION', pair: 'GBPUSD', timeZone: 'Europe/London', open: 8, close: 16.5, elemCard: document.getElementById('card-london'), elemChart: document.getElementById('chart-london'), elemTime: document.getElementById('time-london'), elemDate: document.getElementById('date-london'), elemStatus: document.getElementById('status-london'), elemRate: document.getElementById('rate-london'), elemProgress: document.getElementById('progress-london'), candles: [], wasOpen: false },
            newyork: { type: 'DISTRIBUTION', pair: 'EURUSD', timeZone: 'America/New_York', open: 9.5, close: 16, elemCard: document.getElementById('card-newyork'), elemChart: document.getElementById('chart-newyork'), elemTime: document.getElementById('time-newyork'), elemDate: document.getElementById('date-newyork'), elemStatus: document.getElementById('status-newyork'), elemRate: document.getElementById('rate-newyork'), elemProgress: document.getElementById('progress-newyork'), candles: [], wasOpen: false }
        };


        // --- 3. FETCH API DATA REAL-TIME & FALLBACK ---
        async function fetchRealtimeRates() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                if (data && data.rates) {
                    const usdjpy = data.rates.JPY ? data.rates.JPY.toFixed(2) : '154.20';
                    const gbpusd = data.rates.GBP ? (1 / data.rates.GBP).toFixed(4) : '1.2650';
                    const eurusd = data.rates.EUR ? (1 / data.rates.EUR).toFixed(4) : '1.0840';

                    markets.tokyo.elemRate.innerText = usdjpy;
                    markets.london.elemRate.innerText = gbpusd;
                    markets.newyork.elemRate.innerText = eurusd;
                }
            } catch (err) {
                // Fallback simulation bila offline
                markets.tokyo.elemRate.innerText = (154.00 + Math.random() * 0.5).toFixed(2);
                markets.london.elemRate.innerText = (1.2640 + Math.random() * 0.002).toFixed(4);
                markets.newyork.elemRate.innerText = (1.0830 + Math.random() * 0.002).toFixed(4);
            }
        }


        // --- 4. ECONOMIC NEWS CALENDAR COUNTDOWN ---
        const newsEvents = [
            { currency: 'USD', title: 'FOMC Interest Rate Decision', hoursFromNow: 2.2 },
            { currency: 'GBP', title: 'CPI Inflation Rate YoY', hoursFromNow: 5.5 },
            { currency: 'JPY', title: 'BOJ Monetary Policy Statement', hoursFromNow: 9.0 }
        ];
        let currentNewsIdx = 0;

        function updateNewsCalendar() {
            const event = newsEvents[currentNewsIdx];
            event.hoursFromNow -= (1 / 3600); // Berkurang tiap detik

            if (event.hoursFromNow <= 0) {
                currentNewsIdx = (currentNewsIdx + 1) % newsEvents.length;
                return;
            }

            const totalMinutes = Math.floor(event.hoursFromNow * 60);
            const hrs = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;

            document.getElementById('news-title').innerText = `${event.currency} - ${event.title}`;
            document.getElementById('news-timer').innerText = `(in ${hrs}h ${mins}m)`;
        }


        // --- 5. AMD CANDLESTICK GENERATOR ENGINE ---
        function initCandles(market) {
            market.candles = [];
            let price = 100;
            for (let i = 0; i < 12; i++) {
                let open = price;
                let close, high, low;

                if (market.type === 'ACCUMULATION') {
                    close = open + (Math.random() - 0.5) * 2.5;
                    high = Math.max(open, close) + Math.random() * 1.5;
                    low = Math.min(open, close) - Math.random() * 1.5;
                } else if (market.type === 'MANIPULATION') {
                    let isFakeBreak = (i === 5 || i === 6 || i === 10);
                    let delta = (Math.random() - 0.48) * (isFakeBreak ? 18 : 6);
                    close = open + delta;
                    high = Math.max(open, close) + (isFakeBreak ? 15 : Math.random() * 6);
                    low = Math.min(open, close) - (isFakeBreak ? 15 : Math.random() * 6);
                } else {
                    close = open + 4.5 + Math.random() * 3.5;
                    high = close + Math.random() * 2;
                    low = open - Math.random() * 2;
                }
                market.candles.push({ open, close, high, low });
                price = close;
            }
        }

        function renderChart(market) {
            const svg = market.elemChart;
            const minVal = Math.min(...market.candles.map(c => c.low));
            const maxVal = Math.max(...market.candles.map(c => c.high));
            const range = maxVal - minVal || 1;

            let html = `
                <circle cx="100" cy="100" r="95" stroke="#d4af37" stroke-width="0.5" fill="none" opacity="0.12"/>
                <circle cx="100" cy="100" r="65" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="3" fill="none" opacity="0.18"/>
            `;

            market.candles.forEach((c, idx) => {
                const x = 20 + idx * 14;
                const isGreen = c.close >= c.open;
                const color = isGreen ? '#3fb950' : '#f85149';

                const yHigh = 160 - ((c.high - minVal) / range) * 120;
                const yLow = 160 - ((c.low - minVal) / range) * 120;
                const yOpen = 160 - ((c.open - minVal) / range) * 120;
                const yClose = 160 - ((c.close - minVal) / range) * 120;

                const yBody = Math.min(yOpen, yClose);
                const heightBody = Math.max(Math.abs(yClose - yOpen), 2.5);

                html += `
                    <line x1="${x+3}" y1="${yHigh}" x2="${x+3}" y2="${yLow}" stroke="${color}" stroke-width="1.2" opacity="0.8"/>
                    <rect x="${x}" y="${yBody}" width="6" height="${heightBody}" fill="${color}" opacity="0.8" rx="1"/>
                `;
            });
            svg.innerHTML = html;
        }

        function updateLiveCandle(market) {
            if (market.candles.length === 0) return;
            let lastCandle = market.candles[market.candles.length - 1];
            let delta = (market.type === 'ACCUMULATION') ? (Math.random() - 0.5) * 1.2 :
                        (market.type === 'MANIPULATION') ? (Math.random() - 0.48) * 8.5 : (Math.random() - 0.25) * 3.8;

            lastCandle.close += delta;
            lastCandle.high = Math.max(lastCandle.high, lastCandle.close);
            lastCandle.low = Math.min(lastCandle.low, lastCandle.close);

            if (Math.random() < 0.38) {
                market.candles.shift();
                let open = lastCandle.close;
                let close = open + ((market.type === 'ACCUMULATION') ? (Math.random() - 0.5) * 2 :
                             (market.type === 'MANIPULATION') ? (Math.random() - 0.48) * 12 : (Math.random() - 0.2) * 6);

                market.candles.push({ open, close, high: Math.max(open, close) + Math.random() * 4, low: Math.min(open, close) - Math.random() * 4 });
            }
            renderChart(market);
        }


        // --- 6. CLOCK & SESSION STATUS TRACKER ---
        function updateClocks() {
            const now = new Date();
            Object.keys(markets).forEach(key => {
                const market = markets[key];
                const timeStr = new Intl.DateTimeFormat('id-ID', { timeZone: market.timeZone, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
                const dateStr = new Intl.DateTimeFormat('id-ID', { timeZone: market.timeZone, weekday: 'short', day: 'numeric', month: 'short' }).format(now);

                market.elemTime.innerText = timeStr;
                market.elemDate.innerText = dateStr;

                const marketDate = new Date(now.toLocaleString('en-US', { timeZone: market.timeZone }));
                const currentDecimalTime = marketDate.getHours() + (marketDate.getMinutes() / 60);
                const isWeekend = (marketDate.getDay() === 0 || marketDate.getDay() === 6);
                const isOpen = !isWeekend && (currentDecimalTime >= market.open && currentDecimalTime < market.close);

                // TRIGER AUDIO CHIME SAAT STATUS BERUBAH MENJADI OPEN
                if (isOpen && !market.wasOpen) {
                    playOpenChime();
                }
                market.wasOpen = isOpen;

                if (isOpen) {
                    market.elemStatus.innerText = "OPEN";
                    market.elemStatus.className = "status-badge status-open";
                    market.elemCard.classList.add("active-market");
                    market.elemProgress.style.width = `${Math.min(Math.max(((currentDecimalTime - market.open) / (market.close - market.open)) * 100, 0), 100)}%`;
                } else {
                    market.elemStatus.innerText = "CLOSED";
                    market.elemStatus.className = "status-badge status-closed";
                    market.elemCard.classList.remove("active-market");
                    market.elemProgress.style.width = "0%";
                }
            });

            updateNewsCalendar();
        }

        // --- INIT & INTERVAL LOOPS ---
        Object.keys(markets).forEach(key => { 
            initCandles(markets[key]); 
            renderChart(markets[key]); 
        });

        setInterval(updateClocks, 1000);
        setInterval(() => { Object.keys(markets).forEach(key => updateLiveCandle(markets[key])); }, 400);
        setInterval(fetchRealtimeRates, 60000); // Update kurs harga tiap 60 detik

        updateClocks();
        fetchRealtimeRates();
    </script>
</body>
</html>
